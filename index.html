<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio Digital</title>
    <script type="module" src="./dist/main.js" defer></script>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <h1>Cardápio Digital</h1>
    </header>

    <main class="conteiner">
      <!-- Seção do formulário para cadastro -->
      <section class="form-section">
        <h2>Cadastrar Novo Prato</h2>
        <form id="form-produto">
          <input type="text" id="nome" placeholder="Nome do Prato" required />
          <input
            type="number"
            id="preco"
            step="0.01"
            placeholder="Preço (R$)"
            required
          />
          <input
            type="text"
            id="descricao"
            placeholder="Descrição do Prato"
            required
          />
          <input
            type="url"
            id="imagemUrl"
            placeholder="URL da Imagem"
            required
          />
          <button type="submit">Adicionar Prato</button>
        </form>
      </section>

      <!-- Seção do cardápio (Inicia 100% Vazio)-->
      <section class="cardapio-section">
        <h2>Nossos Pratos</h2>
        <div id="cardapio-conteiner" class="cardapio-grid"></div>
      </section>
    </main>
  </body>
</html>
